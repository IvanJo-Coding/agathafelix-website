<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { background: var(--surface-page); padding: 18px; display: flex; gap: 14px; align-items: center; justify-content: center; }
  .mat { background: #fff; border: 2px solid var(--af-ink); border-radius: var(--radius-md); box-shadow: var(--shadow-sticker); padding: 7px; flex-shrink: 0; }
  .mat img { width: 132px; height: 132px; object-fit: cover; border-radius: 10px; display: block; }
  .note { max-width: 220px; font-size: 12px; line-height: 1.65; }
  .note b { color: var(--text-heading); font-family: var(--font-display); font-size: 14px; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="mat"><img src="../assets/products/business-file.png" alt="Business File"/></div>
  <div class="mat"><img src="../assets/products/clear-holder.png" alt="Clear Holder"/></div>
  <div class="mat"><img src="../assets/products/map-executive.png" alt="Map Executive"/></div>
  <div class="note">
    <b>Foto produk asli</b>
    Warm daylight, sering dengan properti tanaman hijau & callout putih (“Kancing”, “Jaring 1/2”). Pasang dalam mat putih + outline sticker. Lihat <code>assets/products/</code>.
  </div>
</body>
</html>
