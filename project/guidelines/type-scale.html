<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="1.25 ratio from 16px base" -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { background: var(--surface-page); padding: 18px 26px; }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px dashed var(--af-line); padding: 7px 0; }
  .row code { font-size: 10px; color: var(--text-muted); width: 110px; flex-shrink: 0; }
  .row span { font-family: var(--font-display); font-weight: 800; color: var(--text-heading); line-height: 1.1; white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><code>--text-3xl · 54</code><span style="font-size:var(--text-3xl)">Hero display</span></div>
  <div class="row"><code>--text-2xl · 42</code><span style="font-size:var(--text-2xl)">Heading 1</span></div>
  <div class="row"><code>--text-xl · 31</code><span style="font-size:var(--text-xl)">Heading 2</span></div>
  <div class="row"><code>--text-lg · 23</code><span style="font-size:var(--text-lg)">Card title</span></div>
  <div class="row"><code>--text-md · 18</code><span style="font-size:var(--text-md);font-family:var(--font-body);font-weight:500">Lead paragraph</span></div>
  <div class="row"><code>--text-base · 16</code><span style="font-size:var(--text-base);font-family:var(--font-body);font-weight:400">Body copy</span></div>
  <div class="row"><code>--text-sm · 13</code><span style="font-size:var(--text-sm);font-family:var(--font-body);font-weight:400">Caption / secondary</span></div>
</body>
</html>
