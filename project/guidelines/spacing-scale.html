<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base — sections breathe at 96px" -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { background: var(--surface-page); padding: 20px 26px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { text-align: center; }
  .bar { background: var(--af-blue-soft); border: 1.5px solid var(--af-blue); border-radius: 6px; width: 34px; margin: 0 auto 6px; }
  .item code { font-size: 9px; color: var(--text-muted); display: block; }
  .item b { font-size: 10px; color: var(--text-heading); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><b>4</b><code>--space-1</code></div>
    <div class="item"><div class="bar" style="height:8px"></div><b>8</b><code>--space-2</code></div>
    <div class="item"><div class="bar" style="height:12px"></div><b>12</b><code>--space-3</code></div>
    <div class="item"><div class="bar" style="height:16px"></div><b>16</b><code>--space-4</code></div>
    <div class="item"><div class="bar" style="height:24px"></div><b>24</b><code>--space-5</code></div>
    <div class="item"><div class="bar" style="height:32px"></div><b>32</b><code>--space-6</code></div>
    <div class="item"><div class="bar" style="height:48px"></div><b>48</b><code>--space-7</code></div>
    <div class="item"><div class="bar" style="height:64px"></div><b>64</b><code>--space-8</code></div>
    <div class="item"><div class="bar" style="height:80px"></div><b>96</b><code>--space-9</code></div>
  </div>
</body>
</html>
