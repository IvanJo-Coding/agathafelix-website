<!-- @dsCard group="Colors" viewport="700x150" name="Ink & paper neutrals" subtitle="Warm cream paper, white sticker cards, near-black ink" -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { background: var(--surface-page); padding: 18px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--af-line); background: #fff; }
  .sw .chip { height: 52px; }
  .sw .meta { padding: 6px 10px; font-size: 10px; line-height: 1.5; }
  .sw .meta b { display: block; font-size: 11px; color: var(--text-heading); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--af-ink)"></div><div class="meta"><b>--af-ink</b>headings</div></div>
    <div class="sw"><div class="chip" style="background:var(--af-ink-2)"></div><div class="meta"><b>--af-ink-2</b>body text</div></div>
    <div class="sw"><div class="chip" style="background:var(--af-ink-3)"></div><div class="meta"><b>--af-ink-3</b>muted</div></div>
    <div class="sw"><div class="chip" style="background:var(--af-line)"></div><div class="meta"><b>--af-line</b>hairlines</div></div>
    <div class="sw"><div class="chip" style="background:var(--af-paper-2)"></div><div class="meta"><b>--af-paper-2</b>alt band</div></div>
    <div class="sw"><div class="chip" style="background:var(--af-paper);border-bottom:1px solid var(--af-line)"></div><div class="meta"><b>--af-paper</b>page bg</div></div>
  </div>
</body>
</html>
