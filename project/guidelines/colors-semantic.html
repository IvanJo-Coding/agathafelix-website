<!-- @dsCard group="Colors" viewport="700x150" name="Semantic & CTA" subtitle="WhatsApp green is reserved for conversion CTAs only" -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { background: var(--surface-page); padding: 18px; display: flex; gap: 12px; align-items: stretch; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 14px 16px; color: #fff; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; justify-content: flex-end; min-height: 80px; }
  .sw b { font-family: var(--font-display); font-size: 14px; display: block; }
  .sw code { font-size: 9px; opacity: .85; }
</style>
</head>
<body>
  <div class="sw" style="background:var(--af-wa);box-shadow:0 4px 0 var(--af-wa-deep)"><b>WhatsApp CTA</b><code>--color-cta #25D366</code></div>
  <div class="sw" style="background:var(--success)"><b>Success</b><code>--success</code></div>
  <div class="sw" style="background:var(--warning)"><b>Warning</b><code>--warning</code></div>
  <div class="sw" style="background:var(--danger)"><b>Danger</b><code>--danger</code></div>
  <div class="sw" style="background:var(--info)"><b>Info</b><code>--info</code></div>
</body>
</html>
