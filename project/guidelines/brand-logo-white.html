<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body { background: var(--surface-page); padding: 18px; display: flex; gap: 14px; justify-content: center; }
  .tile { border-radius: var(--radius-lg); width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
  img { width: 104px; }
</style>
</head>
<body>
  <div class="tile" style="background:var(--af-orange)"><img src="../assets/logo-mark-white.png" alt="Mark on orange"/></div>
  <div class="tile" style="background:var(--af-purple)"><img src="../assets/logo-mark-white.png" alt="Mark on purple"/></div>
  <div class="tile" style="background:var(--af-blue)"><img src="../assets/logo-mark-white.png" alt="Mark on blue"/></div>
  <div class="tile" style="background:var(--af-ink)"><img src="../assets/logo-mark-white.png" alt="Mark on ink"/></div>
</body>
</html>
